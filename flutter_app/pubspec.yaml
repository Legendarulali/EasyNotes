name: flutter_app
description: "EasyNotes – handwritten notes with a Rust core engine."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Rust core engine (built by cargokit from ../rust_engine).
  rust_engine:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdfrx: ^2.12.0
  file_picker: ^13.3.2
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  googleapis_auth: ^2.3.7
  http: ^1.6.0
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Roboto (Apache-2.0): embedded into PDFs so Romanian diacritics export correctly.
    - assets/fonts/Roboto-Regular.ttf

  fonts:
    - family: NoteFont
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
